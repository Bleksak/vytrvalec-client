image: alpine:3.21.3

variables:
  K8S_VERSION: v1.22.5
  APP: ${CI_REGISTRY_IMAGE}/app:${CI_COMMIT_SHORT_SHA}
  KUSTOMIZE: kustomization/kustomize.yaml
  SECURE_FILES_DOWNLOAD_PATH: '.'

stages:
  - build
  - deploy

build application image:
  stage: build
  image:
    name: pernodricard/kaniko-alpine:latest
    entrypoint: [""]

  before_script:
    - apk --update add bash gettext
    - wget "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer"
    - chmod +x installer
    - bash installer

  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile Dockerfile --destination $APP --verbosity info

deploy test:
  stage: deploy
  environment: production
  when: manual
  script:
    - wget -O /usr/local/bin/kubectl https://storage.googleapis.com/kubernetes-release/release/$K8S_VERSION/bin/linux/amd64/kubectl
    - chmod +x /usr/local/bin/kubectl
    - cat kube/client.yaml | envsubst | tee kube/client.yaml
    - kubectl apply -f kube
    - kubectl rollout restart -n vytrvalec-kts deployment vytrvalec-nginx
