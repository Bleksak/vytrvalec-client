<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" >
		<link rel="icon" href="%sveltekit.assets%/favicon.png" >
		<link rel="preload" as="style" href="/style_v2.css?v=1.00" onload="this.onload=null;this.rel='stylesheet';" >
		<!-- <link rel="preload" as="style" href="/style.css?v=1.01" onload="this.onload=null;this.rel='stylesheet';" > -->
		<meta name="viewport" content="width=device-width, initial-scale=1" >
		<meta name="apple-itunes-app" content="app-id=6743554661">
		<meta
			name="description"
			content="Akce měsíční vytrvalec vznikla během zimního semestru v roce 2020. Tuto pohybovou soutěž připravil a zorganizoval Ústav tělesné výchovy a sportu ZČU s úmyslem rozhýbat studenty během distanční výuky, která probíhala na ZČU během koronavirové pandemie."
		>

		<meta
			name="keywords"
			content="měsíční, vytrvalec, akce, pohyb, sport, běh, chůze, zču, západočeská univerzita, plzeň, fakulta, katedra, soutěž, měsíční vytrvalec, výzva"
		>

		<meta
			name="author"
			content="Ústav tělesné výchovy a sportu ZČU"
		>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="tap" data-sveltekit-preload-code="viewport">
		<div id="root" style="display: contents">
			%sveltekit.body%
		</div>
	</body>
</html>
