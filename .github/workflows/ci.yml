name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Generate paraglide messages
              run: npx paraglide-js compile --project ./project.inlang --outdir ./src/paraglide --strategy url preferredLanguage baseLocale

            - name: Generate typesafe-i18n files
              run: npx typesafe-i18n --no-watch

            - name: Run svelte-check
              run: npm run check
